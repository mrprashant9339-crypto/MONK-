<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#17151a">
  <title>Page not found — MONK</title>
  <meta name="description" content="The page you're looking for doesn't exist or may have moved. Find your way back to MONK.">
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#17151a;color:#fff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 70% 20%,#4c263a 0,transparent 48%),#17151a}
    main{width:min(100%,680px);padding:clamp(28px,6vw,58px);border:1px solid #40323c;border-radius:24px;background:#211d23}
    .mark{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#ef78ad;color:#17151a;font-weight:900;font-size:22px}
    .code{margin:35px 0 8px;color:#ef78ad;font:700 13px ui-monospace,monospace;letter-spacing:2px}
    h1{margin:0;font-size:clamp(38px,8vw,64px);letter-spacing:-2px;line-height:1.02}
    p{max-width:490px;color:#c7bdc6;line-height:1.8;font-size:15px}
    nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
    a{display:inline-flex;align-items:center;min-height:44px;padding:0 17px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:700;background:#ef78ad;color:#17151a}
    a.secondary{background:transparent;color:#fff;border:1px solid #62515f}
  </style>
</head>
<body><main>
  <span class="mark" aria-label="MONK">M</span>
  <p class="code">ERROR 404 / PAGE NOT FOUND</p>
  <h1>This page took<br>another route.</h1>
  <p>The link may be outdated, or the address may be incorrect. The page hasn't been found. You can return to MONK or explore one of the main workspaces.</p>
  <nav aria-label="Helpful destinations">
    <a href="/">Back to MONK</a><a class="secondary" href="/campus">Campus</a><a class="secondary" href="/business">Business</a><a class="secondary" href="/faq">FAQ</a>
  </nav>
</main></body></html>
