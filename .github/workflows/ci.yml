name: MONK CI

on:
  push:
    branches: [main, frontend-first-complete, phase-7-campus-workspace]
  pull_request:
    branches: [main, frontend-first-complete]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Type-check and production build
        run: npm run build
      - name: Release smoke tests
        run: npm run test:release
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Upload browser screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monk-browser-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
