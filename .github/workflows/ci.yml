name: MONK CI

on:
  push:
    branches:
      - main
      - phase-2-auth-organization-core
      - task-3-staging-environment
      - monk-full-workflow-blueprint
  pull_request:
    branches:
      - main
      - phase-2-auth-organization-core
      - task-3-staging-environment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and Vite build
        run: npm run build
