name: MONK CI

on:
  push:
    branches: [main, feat/india-wide-discovery-and-policy-engine]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build frontend
        run: npm run build
      - name: Check Cloudflare Worker syntax
        run: node --check worker/index.js
      - name: Type-check Supabase Edge Functions
        run: |
          deno check --no-lock supabase/functions/_shared/policy.ts
          deno check --no-lock supabase/functions/directory-import/index.ts
          deno check --no-lock supabase/functions/policy-resolve/index.ts
          deno check --no-lock supabase/functions/policy-accept/index.ts
