name: Bootstrap reproducible npm lockfile

on:
  push:
    branches:
      - fix/monk-release-integration-v2

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile if missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Commit lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f package-lock.json ]; then
            echo "Lockfile generation failed." >&2
            exit 1
          fi
          rm .github/workflows/bootstrap-lockfile.yml
          git add package-lock.json .github/workflows/bootstrap-lockfile.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "build: add reproducible npm dependency lockfile"
          git push
