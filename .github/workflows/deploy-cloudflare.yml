name: Deploy MONK to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Add CLOUDFLARE_API_TOKEN in GitHub Actions secrets." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Add CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets." && exit 1)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check and build
        env:
          VITE_GA4_MEASUREMENT_ID: ${{ secrets.VITE_GA4_MEASUREMENT_ID }}
        run: npm run build

      - name: Release smoke tests
        run: npm run test:release

      - name: Local Chromium end-to-end tests
        env:
          VITE_GA4_MEASUREMENT_ID: ${{ secrets.VITE_GA4_MEASUREMENT_ID }}
        run: npm run test:e2e

      - name: Wait for Vercel origin SPA routes
        run: |
          for attempt in $(seq 1 24); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' https://origin.monk.monster/ || true)
            if [ "$status" = "200" ]; then
              echo "Vercel origin SPA route is ready."
              exit 0
            fi
            echo "Waiting for Vercel origin deployment (attempt $attempt/24, HTTP $status)..."
            sleep 10
          done
          echo "Vercel origin homepage did not become ready after 4 minutes." >&2
          exit 1
      - name: Deploy isolated Vercel proxy Worker
        run: npx wrangler deploy --config wrangler.preview.jsonc

      - name: Verify Cloudflare Worker to Vercel origin preview
        env:
          MONK_BASE_URL: https://preview.monk.monster
        run: npx playwright test tests/e2e/worker-vercel-proxy.spec.ts

      - name: Verify invitation Edge Function CORS policy
        run: node --test tests/integration/edge-function-cors.test.mjs
      - name: Deploy static assets to Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production Worker is using Vercel origin
        run: node --test tests/integration/production-worker-origin.test.mjs

      - name: Live production Chromium tests
        env:
          MONK_BASE_URL: https://monk.monster
          VITE_GA4_MEASUREMENT_ID: ${{ secrets.VITE_GA4_MEASUREMENT_ID }}
        run: npm run test:e2e

      - name: Upload deployment browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monk-production-browser-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
